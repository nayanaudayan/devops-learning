apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-learning
  template:
    metadata:
      labels:
        app: devops-learning
    spec:
      containers:
        - name: app
          image: devops-learning:1.0   # built locally; see guide step 6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "k8s-1.0"
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: devops-learning
spec:
  selector:
    app: devops-learning
  ports:
    - port: 80
      targetPort: 3000
